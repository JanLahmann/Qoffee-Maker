theme: jekyll-theme-hacker
url: https://qoffee-maker.org
# /sitemap.xml and /robots.txt (with its Sitemap line), generated by GitHub Pages
plugins:
  - jekyll-sitemap
# Social preview image for every page (jekyll-seo-tag) and large Twitter/X cards
defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/og-image.png
        width: 1200
        height: 630
twitter:
  card: summary_large_image
