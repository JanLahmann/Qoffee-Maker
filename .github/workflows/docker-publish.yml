name: Docker
# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches: [main]
    # Docs-only pushes don't rebuild (and so don't overwrite) the published VERSION tags.
    paths-ignore: ['**.md', 'QoffeeMaker Instructions/**']
  pull_request:
    types: [ opened, synchronize, reopened ]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  VERSION: 1.5.1
  # Pull requests only build; images are pushed only from main.
  PUSH: ${{ github.ref == 'refs/heads/main' }}

# Never let two main runs race to push the same tags.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Both images are loaded into the local Docker store for the smoke test; make room for them.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # Workarounds
      # Workaround: https://github.com/docker/buildx/issues/495
      - name: Set up QEMU
        id: qemu
        uses: docker/setup-qemu-action@v3
        with:
          image: tonistiigi/binfmt:latest
          platforms: all
      # Workaround: https://github.com/docker/build-push-action/issues/461
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      # Published VERSION tags are immutable: a push to main without a VERSION bump builds and
      # smoke-tests, but doesn't overwrite an image that has already been released and tested.
      - name: Check whether VERSION is already published
        id: publish
        run: |
          if [ "$PUSH" != "true" ]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
          elif out=$(docker buildx imagetools inspect "$(echo "$REGISTRY/$IMAGE_NAME" | tr '[:upper:]' '[:lower:]'):$VERSION" 2>&1); then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "Not pushing: $VERSION is already published (bump VERSION to release)."
          elif echo "$out" | grep -qi "not found"; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            # Fail closed: a registry or network error must not lead to overwriting a released tag.
            echo "$out"; exit 1
          fi

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: steps.publish.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata for ARM
        id: meta-arm
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-arm
          tags: |
            ${{ env.VERSION }}
      - name: Extract Docker metadata for AMD
        id: meta-amd
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-amd64
          tags: |
            ${{ env.VERSION }}
      # - name: Extract Docker metadata for ARM64
      #   id: meta-arm64
      #   uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
      #   with:
      #     images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      #     tags: |
      #       type=ref,event=branch,prefix=arm64-

      # Build each image into the local Docker store, smoke-test it, and push only if every test passed (main only).
      # https://github.com/docker/build-push-action
      - name: Build Docker image ARM
        id: build-arm
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta-arm.outputs.tags }}
          labels: ${{ steps.meta-arm.outputs.labels }}
          file: DockerfileArm
          platforms: linux/arm/v7
      - name: Smoke-test Docker image ARM
        run: .github/docker-smoke-test.sh "${{ fromJSON(steps.meta-arm.outputs.json).tags[0] }}" linux/arm/v7
      - name: Build Docker image AMD
        id: build-amd
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta-amd.outputs.tags }}
          labels: ${{ steps.meta-amd.outputs.labels }}
          file: DockerfileAmd64
          platforms: linux/amd64
      - name: Smoke-test Docker image AMD
        run: .github/docker-smoke-test.sh "${{ fromJSON(steps.meta-amd.outputs.json).tags[0] }}" linux/amd64
      - name: Push Docker images
        if: steps.publish.outputs.push == 'true'
        run: |
          docker push "${{ fromJSON(steps.meta-arm.outputs.json).tags[0] }}"
          docker push "${{ fromJSON(steps.meta-amd.outputs.json).tags[0] }}"
      # - name: Build and push Docker image ARM64
      #   id: build-and-push-arm
      #   uses: docker/build-push-action@ad44023a93711e3deb337508980b4b5e9bcdc5dc
      #   with:
      #     context: .
      #     tags: ${{ steps.meta-arm.outputs.tags }}
      #     labels: ${{ steps.meta-arm.outputs.labels }}
      #     file: DockerfileArm64
      #     platforms: linux/arm64
      - name: Create Docker manifest
        if: steps.publish.outputs.push == 'true'
        run: |
          set -x
          CONTAINER_REPO=`echo ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]'`
          echo $CONTAINER_REPO
          # old version used manifest. Needs to be replaced according to https://stackoverflow.com/questions/75521775/buildx-docker-image-claims-to-be-a-manifest-list
          #echo creating version manifest list
          #docker manifest create $CONTAINER_REPO:${{ env.VERSION }} $CONTAINER_REPO-arm:${{ env.VERSION }} $CONTAINER_REPO-amd64:${{ env.VERSION }}
          #echo pushing version manifest list
          #docker manifest push $CONTAINER_REPO:${{ env.VERSION }}
          #
          #echo creating latest manifest list
          #docker manifest create $CONTAINER_REPO:latest $CONTAINER_REPO-arm:${{ env.VERSION }} $CONTAINER_REPO-amd64:${{ env.VERSION }}
          #echo pushing latest manifest list
          #docker manifest push $CONTAINER_REPO:latest
          #
          echo "build and push the new multi-platform image"
          docker buildx imagetools create -t $CONTAINER_REPO:${{ env.VERSION }} $CONTAINER_REPO-arm:${{ env.VERSION }} $CONTAINER_REPO-amd64:${{ env.VERSION }}
          # do not push versions > 1.2.99 with tag "latest", as they might not be working
          # docker buildx imagetools create -t $CONTAINER_REPO:latest $CONTAINER_REPO-arm:${{ env.VERSION }} $CONTAINER_REPO-amd64:${{ env.VERSION }}
